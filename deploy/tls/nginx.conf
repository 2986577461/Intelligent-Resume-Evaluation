worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off; # SSE query strings can contain resume/prompt data.
    sendfile on;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 443 ssl;
        server_name www.myzyitzj.cn;
        ssl_certificate /etc/nginx/resume-certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/resume-certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        absolute_redirect off;
        client_max_body_size 20m;

        location = /_tls-health { return 204; }
        location = /resume { return 308 /resume/; }
        location /resume/ {
            alias /usr/share/nginx/resume/;
            index index.html;
            try_files $uri $uri/ /resume/index.html;
        }
        location /resume/api/ {
            set $backend resume-backend:8000;
            rewrite ^/resume(/api/.*)$ $1 break;
            proxy_pass http://$backend$uri$is_args$args;
            proxy_http_version 1.1;
            # Keep :19443. $host drops the port and breaks same-origin checks.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
        location = /resume/chat-stream {
            set $backend resume-backend:8000;
            proxy_pass http://$backend/chat-stream$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        # Existing sites continue through their original Nginx.
        location / {
            set $legacy nginx:80;
            proxy_pass http://$legacy$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_buffering off;
        }
    }
}
