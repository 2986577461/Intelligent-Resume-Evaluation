name: Build approved release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resume-production-release
  cancel-in-progress: false
jobs:
  build:
    # Development pushes/PRs run CI only; production is manually released from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-backend/requirements-ci.txt
      - name: Offline tests
        env:
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
        run: |
          python -m pip install -r ai-backend/requirements-ci.txt
          python -m pip check
          (cd ai-backend && python -m pytest -v -m 'not llm and not consistency' --disable-socket --allow-unix-socket)
          python -m unittest discover -s scripts/cd -p 'test_*.py' -v
      - name: Build frontend
        env:
          VITE_PUBLIC_ORIGIN: https://www.myzyitzj.cn:19443
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base=/resume/
      - name: Build production image on runner (not production host)
        run: docker build --pull -t "resume-backend:$GITHUB_SHA" -f deploy/resume/Dockerfile .
      - name: Isolated HTTPS and business smoke (no model API calls)
        env:
          SHA: ${{ github.sha }}
        run: bash scripts/cd/smoke-release.sh
      - name: Package immutable release
        run: |
          mkdir bundle
          docker save "resume-backend:$GITHUB_SHA" | gzip -1 > bundle/backend.tar.gz
          tar -czf bundle/frontend.tar.gz -C frontend/dist .
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('bundle')
          def digest(path):
              value=hashlib.sha256()
              with path.open('rb') as source:
                  for block in iter(lambda: source.read(1024*1024), b''):
                      value.update(block)
              return value.hexdigest()
          manifest={'schema':1,'sha':os.environ['GITHUB_SHA'],
                    'image':'resume-backend:'+os.environ['GITHUB_SHA'],
                    'run_id':int(os.environ['GITHUB_RUN_ID']),
                    'sha256':{name:digest(root/name) for name in ['backend.tar.gz','frontend.tar.gz']}}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Publish after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="resume-$GITHUB_SHA"
          # Fail on an existing tag/release rather than silently replace artifacts.
          gh release create "$tag" --target "$GITHUB_SHA" --draft \
            --title "Resume $GITHUB_SHA" \
            --notes "Manually released from main. Build and startup checks passed. Server independently verifies this workflow's final conclusion." \
            bundle/manifest.json bundle/backend.tar.gz bundle/frontend.tar.gz
          gh release edit "$tag" --draft=false --latest
          echo "Published $tag. Server polls every two minutes; workflow success does not imply deployment success." >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up smoke containers
        if: always()
        run: |
          docker rm -f smoke-gateway smoke-backend smoke-redis 2>/dev/null || true
          docker network rm release-smoke 2>/dev/null || true
