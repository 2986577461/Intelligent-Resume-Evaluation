name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production paths
        env:
          VITE_PUBLIC_ORIGIN: https://www.myzyitzj.cn:19443
        run: npm run build -- --base=/resume/

  backend-tests:
    name: Backend offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-backend
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-backend/requirements-ci.txt
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline tests (network disabled)
        run: python -m pytest -v -m "not llm and not consistency" --disable-socket --allow-unix-socket

  deployment-helper-tests:
    name: Deployment helper tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check deployment shell syntax
        run: for script in scripts/cd/*.sh; do bash -n "$script"; done
      - name: Test SSH validation and credential cleanup without connecting
        run: python3 -m unittest discover -s scripts/cd -p 'test_*.py' -v
